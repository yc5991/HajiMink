<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="1010" viewBox="0 0 1180 1010" role="img" aria-labelledby="title desc"><title id="title">业务请求的身份验证流程</title><desc id="desc">本机模式、独立登录和 Cloudflare Access 是可选择的运行模式</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#64748b"/></marker></defs><style>text{font-family:'Microsoft YaHei','PingFang SC','Noto Sans CJK SC',sans-serif;fill:#172554} .edge{fill:none;stroke:#64748b;stroke-width:2} .label{font-size:16px;paint-order:stroke;stroke:white;stroke-width:8;stroke-linejoin:round}</style><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" font-size="26" font-weight="700">业务请求的身份验证流程</text><text x="32" y="55" font-size="15" fill="#475569">本机模式、独立登录和 Cloudflare Access 是可选择的运行模式</text>
<path class="edge" d="M590 140V190" marker-end="url(#arrow)"/>
<path class="edge" d="M480 240H180V365" marker-end="url(#arrow)"/>
<path class="edge" d="M590 290V365" marker-end="url(#arrow)"/>
<path class="edge" d="M700 240H995V365" marker-end="url(#arrow)"/>
<path class="edge" d="M180 465V595H430" marker-end="url(#arrow)"/>
<path class="edge" d="M590 465V550" marker-end="url(#arrow)"/>
<path class="edge" d="M995 465V595H750" marker-end="url(#arrow)"/>
<path class="edge" d="M590 640V710" marker-end="url(#arrow)"/>
<path class="edge" d="M700 760H855" marker-end="url(#arrow)"/>
<path class="edge" d="M590 810V890" marker-end="url(#arrow)"/>
<rect x="430" y="70" width="320" height="70" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="111" text-anchor="middle" font-size="18"><tspan x="590" dy="0" font-weight="600">浏览器发起业务请求</tspan></text>
<polygon points="590,190 700,240 590,290 480,240" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="246" text-anchor="middle" font-size="18"><tspan x="590" dy="0" font-weight="600">读取运行模式</tspan></text>
<rect x="40" y="365" width="280" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="180" y="408" text-anchor="middle" font-size="18"><tspan x="180" dy="0" font-weight="600">local 本机模式</tspan><tspan x="180" dy="26">环回地址与本机访问检查</tspan></text>
<rect x="430" y="365" width="320" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="395" text-anchor="middle" font-size="18"><tspan x="590" dy="0" font-weight="600">owner 独立登录</tspan><tspan x="590" dy="26">密码 / 通行密钥建立登录</tspan><tspan x="590" dy="26">业务请求校验会话 Cookie</tspan></text>
<rect x="855" y="365" width="280" height="100" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="995" y="395" text-anchor="middle" font-size="18"><tspan x="995" dy="0" font-weight="600">access 账户验证</tspan><tspan x="995" dy="26">JWT 签名 / 应用标识</tspan><tspan x="995" dy="26">签发方 / 所有者邮箱</tspan></text>
<rect x="430" y="550" width="320" height="90" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="588" text-anchor="middle" font-size="18"><tspan x="590" dy="0" font-weight="600">主机名、来源与 CSRF 检查</tspan><tspan x="590" dy="26">实时连接也检查来源</tspan></text>
<polygon points="590,710 700,760 590,810 480,760" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
<text x="590" y="766" text-anchor="middle" font-size="18"><tspan x="590" dy="0" font-weight="600">全部检查通过？</tspan></text>
<rect x="855" y="720" width="280" height="85" rx="14" fill="#f1f5f9" stroke="#2563eb" stroke-width="2"/>
<text x="995" y="755.5" text-anchor="middle" font-size="18"><tspan x="995" dy="0" font-weight="600">拒绝未授权请求</tspan><tspan x="995" dy="26">401 / 403，按原因重新验证</tspan></text>
<rect x="430" y="890" width="320" height="70" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-width="2"/>
<text x="590" y="918" text-anchor="middle" font-size="18"><tspan x="590" dy="0" font-weight="600">进入受限业务接口</tspan><tspan x="590" dy="26">继续核对软件能力与请求状态</tspan></text>
<text class="label" x="300" y="227" text-anchor="middle">local</text>
<text class="label" x="626" y="329" text-anchor="middle">owner</text>
<text class="label" x="850" y="227" text-anchor="middle">access</text>
<text class="label" x="775" y="747" text-anchor="middle">否</text>
<text class="label" x="614" y="853" text-anchor="middle">是</text>
<text x="32" y="992" font-size="14">本机模式用于环回访问；正式部署选择 owner 或 access</text></svg>
