name: 问题反馈
description: 报告可以复现的功能或兼容性问题
body:
  - type: markdown
    attributes:
      value: 请先移除凭据、个人路径、会话正文和截图中的私人项目。安全问题请按 SECURITY.md 处理。
  - type: input
    id: versions
    attributes:
      label: 环境版本
      description: Windows、Node.js、浏览器、Agent 桌面版本和项目版本
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: 预期结果与实际结果
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 已脱敏的诊断信息
      description: 不要提交数据库、Tunnel Token、登录 Cookie 或完整会话日志
